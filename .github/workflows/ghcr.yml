name: ghcr

# GitHub-only: build the multi-arch image from the source Dockerfile and push it
# to ghcr.io/<owner>/kiro-proxy. The Gitea release workflow (release.yml) owns
# the git.gasi.dev registry and is skipped on GitHub.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  INSTALL_URL: https://gist.github.com/RobinGasi/c6ee980e39d169fe34b7786d6ef68822

jobs:
  image:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the embedded version

      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          # ghcr.io shows the index annotation as the package description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/kiro-proxy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=kiro-proxy
            org.opencontainers.image.description=OpenAI/Anthropic-compatible proxy for Kiro. Install: ${{ env.INSTALL_URL }}
            org.opencontainers.image.documentation=${{ env.INSTALL_URL }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          annotations: |
            org.opencontainers.image.description=OpenAI/Anthropic-compatible proxy for Kiro. Install: ${{ env.INSTALL_URL }}
            org.opencontainers.image.documentation=${{ env.INSTALL_URL }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
