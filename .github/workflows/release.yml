name: release

# Conventional-commit-driven release. semantic-release analyzes the commits on
# main, computes the next semver and pushes the tag; GoReleaser then builds the
# binaries, creates the Gitea Release, and pushes the multi-arch image to the
# Gitea container registry. Runs under Gitea Actions (needs a registered runner).
on:
  push:
    branches: [main]

permissions:
  contents: write # semantic-release pushes tags; GoReleaser creates releases
  packages: write # push images to the Gitea container registry

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so semantic-release can analyze commits

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # semantic-release owns versioning: analyze commits, compute the next
      # semver, and push the git tag. It does NOT create the release (no publish
      # plugin) — GoReleaser owns that.
      - name: Semantic release (tag only)
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Everything below only runs when a new version was actually published.
      - name: Make the new tag available locally
        if: steps.semrel.outputs.new_release_published == 'true'
        run: git fetch --tags --force

      - name: Release notes to file
        if: steps.semrel.outputs.new_release_published == 'true'
        env:
          NOTES: ${{ steps.semrel.outputs.new_release_notes }}
        run: printf '%s' "$NOTES" > /tmp/release-notes.md

      - name: Set up QEMU
        if: steps.semrel.outputs.new_release_published == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.semrel.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Gitea container registry
        if: steps.semrel.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          registry: git.gasi.dev
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GoReleaser
        if: steps.semrel.outputs.new_release_published == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # --skip=docker: publish binaries + the Gitea release only. The
          # multi-arch container build needs Docker (buildx/qemu) on the runner
          # and the Gitea container registry; drop this flag to re-enable it.
          args: release --clean --skip=docker --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GoReleaser's Gitea release publisher authenticates via GITEA_TOKEN.
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
