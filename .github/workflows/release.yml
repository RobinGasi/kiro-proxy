name: release

# Conventional-commit-driven release. semantic-release analyzes the commits on
# main, computes the next semver and pushes the tag; GoReleaser then builds the
# binaries, creates the Gitea Release, and pushes the multi-arch image to the
# Gitea container registry. Runs under Gitea Actions (needs a registered runner).
on:
  push:
    branches: [main]

permissions:
  contents: write # semantic-release pushes tags; GoReleaser creates releases
  packages: write # push images to the Gitea container registry

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so semantic-release can analyze commits

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # semantic-release owns versioning: analyze commits, compute the next
      # semver, and push the git tag. It does NOT create the release (no publish
      # plugin) — GoReleaser owns that.
      - name: Semantic release (tag only)
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release may push the tag before a later publishing step fails.
      # Always fetch tags; if HEAD is tagged, run the idempotent GoReleaser
      # publication again. release.mode=replace and mutable image tags make
      # retries safe without fragile remote-state probes.
      - name: Fetch release tags
        run: git fetch --tags --force

      - name: Resolve release state
        id: release-state
        env:
          NEW_TAG: ${{ steps.semrel.outputs.new_release_git_tag }}
        run: |
          tag="$NEW_TAG"
          if [ -z "$tag" ]; then
            tag="$(git tag --points-at HEAD --sort=-version:refname | sed -n '1p')"
          fi
          if [ -z "$tag" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release tag at HEAD; nothing to publish"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]; then
            echo "Release tag $tag does not point at HEAD" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - name: Release notes to file
        if: steps.release-state.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release-state.outputs.tag }}
          NOTES: ${{ steps.semrel.outputs.new_release_notes }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s' "$NOTES" > /tmp/release-notes.md
          else
            previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            if [ -n "$previous" ]; then
              git log --format='* %s (%h)' "$previous..$TAG" > /tmp/release-notes.md
            else
              git log --format='* %s (%h)' "$TAG" > /tmp/release-notes.md
            fi
          fi

      - name: Set up QEMU
        if: steps.release-state.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.release-state.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      # Push the multi-arch image and create/replace the Gitea Release with the
      # fresh PAT stored as PUBLISH_TOKEN. Forgejo's automatic Actions token does
      # not have sufficient API/package access on this instance.
      - name: Log in to the Gitea container registry
        if: steps.release-state.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: git.gasi.dev
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PUBLISH_TOKEN }}

      - name: Install GoReleaser
        if: steps.release-state.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.1
          install-only: true

      - name: GoReleaser
        if: steps.release-state.outputs.publish == 'true'
        env:
          # Forgejo also injects GITHUB_TOKEN; force GoReleaser to use Gitea and
          # select the verified publish PAT supplied as GITEA_TOKEN.
          GORELEASER_FORCE_TOKEN: gitea
          GITEA_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          proxy_log="$RUNNER_TEMP/gitea-api-proxy.log"
          release_config="$RUNNER_TEMP/goreleaser.yaml"
          sed 's#api: https://git.gasi.dev/api/v1#api: http://127.0.0.1:18080/api/v1#' \
            .goreleaser.yaml > "$release_config"

          python3 .github/scripts/gitea-api-proxy.py > "$proxy_log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true; cat "$proxy_log"' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/version >/dev/null; then
              break
            fi
            if ! kill -0 "$proxy_pid" 2>/dev/null; then
              echo "Gitea API proxy exited during startup" >&2
              exit 1
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Gitea API proxy did not become ready" >&2
              exit 1
            fi
            sleep 0.25
          done

          goreleaser release --config "$release_config" --clean \
            --release-notes=/tmp/release-notes.md
