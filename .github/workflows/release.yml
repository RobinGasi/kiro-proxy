name: release

# Conventional-commit-driven release. semantic-release analyzes the commits on
# main, computes the next semver and pushes the tag; GoReleaser then builds the
# binaries, creates the Gitea Release, and pushes the multi-arch image to the
# Gitea container registry. Runs under Gitea Actions (needs a registered runner).
on:
  push:
    branches: [main]

permissions:
  contents: write # semantic-release pushes tags; GoReleaser creates releases
  packages: write # push images to the Gitea container registry

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so semantic-release can analyze commits

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # semantic-release owns versioning: analyze commits, compute the next
      # semver, and push the git tag. It does NOT create the release (no publish
      # plugin) — GoReleaser owns that.
      - name: Semantic release (tag only)
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release may push the tag before a later publishing step fails.
      # Always fetch tags, then resume whenever HEAD is tagged but either the
      # Gitea Release or the versioned container image is still missing.
      - name: Fetch release tags
        run: git fetch --tags --force

      - name: Resolve release state
        id: release-state
        env:
          NEW_TAG: ${{ steps.semrel.outputs.new_release_git_tag }}
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          tag="$NEW_TAG"
          if [ -z "$tag" ]; then
            tag="$(git tag --points-at HEAD --sort=-version:refname | sed -n '1p')"
          fi
          if [ -z "$tag" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release tag at HEAD; nothing to publish"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]; then
            echo "Release tag $tag does not point at HEAD" >&2
            exit 1
          fi

          release_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: token $GITEA_TOKEN" \
            "https://git.gasi.dev/api/v1/repos/${GITHUB_REPOSITORY}/releases/tags/$tag")"
          image_tag="${tag#v}"
          image_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user "${GITHUB_REPOSITORY_OWNER}:$REGISTRY_TOKEN" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://git.gasi.dev/v2/${GITHUB_REPOSITORY}/manifests/$image_tag")"
          case "$release_status" in 200|404) ;; *) echo "Unexpected release status: $release_status" >&2; exit 1 ;; esac
          case "$image_status" in 200|404) ;; *) echo "Unexpected image status: $image_status" >&2; exit 1 ;; esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$release_status" = 200 ] && [ "$image_status" = 200 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already fully published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $tag (release HTTP $release_status, image HTTP $image_status)"
          fi

      - name: Release notes to file
        if: steps.release-state.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release-state.outputs.tag }}
          NOTES: ${{ steps.semrel.outputs.new_release_notes }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s' "$NOTES" > /tmp/release-notes.md
          else
            previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            if [ -n "$previous" ]; then
              git log --format='* %s (%h)' "$previous..$TAG" > /tmp/release-notes.md
            else
              git log --format='* %s (%h)' "$TAG" > /tmp/release-notes.md
            fi
          fi

      - name: Set up QEMU
        if: steps.release-state.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.release-state.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      # Push the multi-arch image with a PAT stored as REGISTRY_TOKEN. The
      # automatic Actions token can create the Gitea Release but cannot publish
      # packages on this Forgejo instance.
      - name: Log in to the Gitea container registry
        if: steps.release-state.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: git.gasi.dev
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: GoReleaser
        if: steps.release-state.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          # Forgejo auto-injects GITHUB_TOKEN into every step; GoReleaser picks
          # the target forge from the token env var. Force Gitea mode with that
          # token while REGISTRY_TOKEN is used only by Docker authentication.
          GORELEASER_FORCE_TOKEN: gitea
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
