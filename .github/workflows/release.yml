name: release

# Conventional-commit-driven release. semantic-release analyzes the commits on
# main, computes the next semver and pushes the tag; GoReleaser then builds the
# binaries, creates the GitHub Release, and pushes the multi-arch image to
# ghcr.io/robingasi/kiro-proxy.
on:
  push:
    branches: [main]
  # Re-publish the release tagged at HEAD (e.g. after a failed publish step).
  workflow_dispatch:

permissions:
  contents: write # semantic-release pushes tags; GoReleaser creates releases
  packages: write # push images to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so semantic-release can analyze commits

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # semantic-release owns versioning: analyze commits, compute the next
      # semver, and push the git tag. It does NOT create the release (no publish
      # plugin) — GoReleaser owns that.
      - name: Semantic release (tag only)
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release may push the tag before a later publishing step fails.
      # Always fetch tags; if HEAD is tagged, run the idempotent GoReleaser
      # publication again. release.mode=replace and mutable image tags make
      # retries safe without fragile remote-state probes.
      - name: Fetch release tags
        run: git fetch --tags --force

      - name: Resolve release state
        id: release-state
        env:
          NEW_TAG: ${{ steps.semrel.outputs.new_release_git_tag }}
        run: |
          tag="$NEW_TAG"
          if [ -z "$tag" ]; then
            tag="$(git tag --points-at HEAD --sort=-version:refname | sed -n '1p')"
          fi
          if [ -z "$tag" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release tag at HEAD; nothing to publish"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]; then
            echo "Release tag $tag does not point at HEAD" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - name: Release notes to file
        if: steps.release-state.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release-state.outputs.tag }}
          NOTES: ${{ steps.semrel.outputs.new_release_notes }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s' "$NOTES" > /tmp/release-notes.md
          else
            previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            if [ -n "$previous" ]; then
              git log --format='* %s (%h)' "$previous..$TAG" > /tmp/release-notes.md
            else
              git log --format='* %s (%h)' "$TAG" > /tmp/release-notes.md
            fi
          fi

      - name: Set up QEMU
        if: steps.release-state.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.release-state.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.release-state.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GoReleaser
        if: steps.release-state.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.1
          install-only: true

      - name: GoReleaser
        if: steps.release-state.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean --release-notes=/tmp/release-notes.md
