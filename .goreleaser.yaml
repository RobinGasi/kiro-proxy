# GoReleaser configuration.
#
# Versioning is owned by semantic-release (see .releaserc.json), which analyzes
# Conventional Commits, computes the next semver, and pushes the git tag.
# GoReleaser runs on that tag: it builds the binaries, the checksums, the Gitea
# Release, and the multi-arch container image + manifest on the Gitea registry.
#
# Validate locally without publishing:  goreleaser release --snapshot --clean
# Validate the config only:              goreleaser check
version: 2

project_name: kiro-proxy

# Self-hosted Gitea instance (see `release.gitea` below). Requires GITEA_TOKEN
# with repo+package scope when publishing.
gitea_urls:
  api: https://git.gasi.dev/api/v1
  download: https://git.gasi.dev

before:
  hooks:
    - go mod download

builds:
  - id: kiro-proxy
    main: ./cmd/kiro-proxy
    binary: kiro-proxy
    env:
      - CGO_ENABLED=0 # modernc.org/sqlite is pure Go → fully static binary
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X git.gasi.dev/robin/kiro-proxy/internal/config.AppVersion={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    # Windows users expect a zip.
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  # Release notes are supplied by semantic-release via --release-notes.
  disable: true

# Multi-arch container image (the primary distribution channel — install.sh
# pulls git.gasi.dev/robin/kiro-proxy). buildx builds both arches from the
# prebuilt binaries via Dockerfile.goreleaser and publishes a single manifest.
dockers_v2:
  - images:
      - git.gasi.dev/robin/kiro-proxy
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: kiro-proxy
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "{{ .GitURL }}"

release:
  gitea:
    owner: robin
    name: kiro-proxy
  # Notes are generated by semantic-release and passed via --release-notes.
  mode: replace
