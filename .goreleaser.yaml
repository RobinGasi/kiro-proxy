# GoReleaser configuration.
#
# Versioning is owned by semantic-release (see .releaserc.json), which analyzes
# Conventional Commits, computes the next semver, and pushes the git tag.
# GoReleaser runs on that tag: it builds the binaries, the checksums, the GitHub
# Release, and the multi-arch container image + manifest on ghcr.io.
#
# Validate locally without publishing:  goreleaser release --snapshot --clean
# Validate the config only:              goreleaser check
version: 2

project_name: kiro-proxy

before:
  hooks:
    - go mod download

builds:
  - id: kiro-proxy
    main: ./cmd/kiro-proxy
    binary: kiro-proxy
    env:
      - CGO_ENABLED=0 # modernc.org/sqlite is pure Go → fully static binary
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/RobinGasi/kiro-proxy/internal/config.AppVersion={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    # Windows users expect a zip.
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  # Release notes are supplied by semantic-release via --release-notes.
  disable: true

# Multi-arch container image (the primary distribution channel — install.sh
# pulls ghcr.io/robingasi/kiro-proxy). buildx builds both arches from the
# prebuilt binaries via Dockerfile.goreleaser and publishes a single manifest.
dockers_v2:
  - images:
      - ghcr.io/robingasi/kiro-proxy
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: kiro-proxy
      org.opencontainers.image.description: "OpenAI/Anthropic-compatible proxy for Kiro. Install: https://gist.github.com/RobinGasi/c6ee980e39d169fe34b7786d6ef68822"
      org.opencontainers.image.documentation: https://gist.github.com/RobinGasi/c6ee980e39d169fe34b7786d6ef68822
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: https://github.com/RobinGasi/kiro-proxy
    # ghcr.io shows the index annotation as the package description. Unscoped
    # keys become index annotations for multi-platform builds (and stay plain on
    # single-platform snapshot builds, which reject index annotations).
    annotations:
      org.opencontainers.image.description: "OpenAI/Anthropic-compatible proxy for Kiro. Install: https://gist.github.com/RobinGasi/c6ee980e39d169fe34b7786d6ef68822"

release:
  github:
    owner: RobinGasi
    name: kiro-proxy
  # Notes are generated by semantic-release and passed via --release-notes.
  mode: replace
